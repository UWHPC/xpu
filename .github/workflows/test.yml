name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CXX: g++-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LAPACKE
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblapacke-dev ninja-build

      - name: Test
        run: ./scripts/test.sh --cpp --clean

  cuda:
    name: CUDA
    if: ${{ vars.XPU_CUDA_CI == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: ./scripts/test.sh --cu --clean

  hip:
    name: HIP
    if: ${{ vars.XPU_HIP_CI == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: ./scripts/test.sh --hip --clean
